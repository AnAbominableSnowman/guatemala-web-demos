<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
</head>
<body>
  <div class="demo-banner" id="demo-banner"></div>

  <header class="nav">
    <a class="brand" href="#top" id="brand"></a>
    <nav class="nav-links" id="nav-links"></nav>
    <div class="lang-toggle" role="group" aria-label="Language">
      <button data-lang="es" type="button">ES</button>
      <button data-lang="en" type="button">EN</button>
    </div>
  </header>

  <main id="top">
    <section class="hero" id="hero">
      <div class="hero-inner">
        <p class="eyebrow" id="hero-eyebrow"></p>
        <h1 id="hero-title"></h1>
        <p class="tagline" id="hero-tagline"></p>
        <div class="hero-cta" id="hero-cta"></div>
        <div class="rating" id="hero-rating"></div>
      </div>
    </section>

    <section class="section" id="about">
      <div class="wrap two-col">
        <div>
          <h2 data-i18n="about"></h2>
          <p class="lead" id="about-text"></p>
        </div>
        <div class="photo-grid" id="photo-grid" aria-hidden="true"></div>
      </div>
    </section>

    <section class="section alt" id="offer">
      <div class="wrap">
        <h2 id="offer-title"></h2>
        <div id="offer-body"></div>
      </div>
    </section>

    <section class="section" id="reviews">
      <div class="wrap">
        <h2 data-i18n="reviews"></h2>
        <div class="review-grid" id="review-grid"></div>
      </div>
    </section>

    <section class="section alt" id="visit">
      <div class="wrap two-col">
        <div>
          <h2 data-i18n="visit"></h2>
          <p class="address" id="address"></p>
          <table class="hours" id="hours"></table>
          <div class="contact-links" id="contact-links"></div>
        </div>
        <iframe class="map" id="map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Map"></iframe>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p id="footer-text"></p>
  </footer>

  <a class="wa-float" id="wa-float" target="_blank" rel="noopener" aria-label="WhatsApp">
    <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><path fill="currentColor" d="M16 3C9 3 3.3 8.6 3.3 15.6c0 2.2.6 4.4 1.7 6.3L3 29l7.3-1.9c1.8 1 3.8 1.5 5.8 1.5 7 0 12.7-5.6 12.7-12.6S23 3 16 3zm0 23.1c-1.9 0-3.7-.5-5.3-1.4l-.4-.2-4.3 1.1 1.2-4.2-.3-.4c-1-1.6-1.5-3.5-1.5-5.4 0-5.8 4.8-10.5 10.6-10.5s10.6 4.7 10.6 10.5S21.8 26.1 16 26.1zm5.8-7.9c-.3-.2-1.9-.9-2.2-1-.3-.1-.5-.2-.7.2-.2.3-.8 1-1 1.2-.2.2-.4.2-.7.1-.3-.2-1.3-.5-2.5-1.6-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.5-.6c.2-.2.2-.3.3-.6.1-.2 0-.4 0-.6l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.1-1.2 2.8s1.2 3.2 1.4 3.5c.2.2 2.4 3.6 5.8 5 .8.3 1.4.5 1.9.7.8.3 1.5.2 2.1.1.6-.1 1.9-.8 2.2-1.5.3-.7.3-1.4.2-1.5-.1-.2-.3-.3-.6-.4z"/></svg>
  </a>

  <script src="app.js"></script>
</body>
</html>
